server:
  port: 8082

spring:
  application:
    name: ledger-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentledger}?currentSchema=ledger
    username: ${LEDGER_DB_USER:ledger_user}
    password: ${LEDGER_DB_PASSWORD:ledger_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ledger

  flyway:
    schemas: ledger
    default-schema: ledger
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.paymentledger.ledger.event
        spring.json.value.default.type: com.paymentledger.ledger.event.TransactionInitiatedEvent
        spring.json.use.type.headers: false
    producer:
      # The outbox relay publishes already-serialized JSON text straight from outbox_event rows,
      # so the producer just moves bytes - no object mapping needed on the way out.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  kafka:
    topics:
      transaction-initiated: transaction-initiated
      transaction-outcome: transaction-outcome
  outbox:
    relay:
      poll-interval-ms: 500
      batch-size: 50
