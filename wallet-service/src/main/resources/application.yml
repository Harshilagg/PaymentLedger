server:
  port: 8081

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentledger}?currentSchema=wallet
    username: ${WALLET_DB_USER:wallet_user}
    password: ${WALLET_DB_PASSWORD:wallet_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: wallet

  flyway:
    schemas: wallet
    default-schema: wallet
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wallet-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.paymentledger.wallet.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-min-32-bytes}
    expiration-minutes: 60
  idempotency:
    ttl-hours: 24
  outbox:
    relay:
      poll-interval-ms: 500
      batch-size: 50
