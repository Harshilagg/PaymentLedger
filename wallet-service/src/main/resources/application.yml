server:
  port: 8081

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentledger}?currentSchema=wallet
    username: ${WALLET_DB_USER:wallet_user}
    password: ${WALLET_DB_PASSWORD:wallet_pass}

  mvc:
    problemdetails:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms          # a slow limiter must not become a slow API - see RateLimiter
      connect-timeout: 200ms
    web:
      pageable:
        max-page-size: 100

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: wallet

  flyway:
    schemas: wallet
    default-schema: wallet
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wallet-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.paymentledger.wallet.event
        spring.json.value.default.type: com.paymentledger.wallet.event.TransactionOutcomeEvent
        spring.json.use.type.headers: false
    producer:
      # The outbox relay publishes already-serialized JSON text straight from outbox_event rows,
      # so the producer just moves bytes - no object mapping needed on the way out.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-min-32-bytes}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  ledger-service:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8082}
  idempotency:
    ttl-hours: 24
    cleanup-interval-ms: 3600000
  optimistic-lock:
    max-retries: 5
  rate-limit:
    enabled: true
    # Token bucket per authenticated user, on write endpoints only.
    #
    # capacity is the burst a user may spend at once; refill-per-second is the sustained rate they
    # settle back to. 60/10 means "up to 60 writes in a burst, then 10/sec".
    #
    # Load tests raise this deliberately - see docs/PERFORMANCE.md. A limit tuned for real clients
    # would otherwise make the benchmark measure the bucket instead of the system.
    capacity: 60
    refill-per-second: 10
  outbox:
    relay:
      poll-interval-ms: 500
      batch-size: 50
  kafka:
    topics:
      transaction-initiated: transaction-initiated
      transaction-outcome: transaction-outcome
